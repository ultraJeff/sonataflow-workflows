---
# Secret "sonataflow-psql-postgresql" must exist in sonataflow-infra
# with keys: postgres-username, postgres-password
# Create manually or via ExternalSecret before deploying workflows.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonataflow-psql-postgresql
  namespace: sonataflow-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonataflow-psql-postgresql
  template:
    metadata:
      labels:
        app: sonataflow-psql-postgresql
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          env:
            - name: POSTGRESQL_USER
              value: sonataflow
            - name: POSTGRESQL_PASSWORD
              value: sonataflow
            - name: POSTGRESQL_DATABASE
              value: sonataflow
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: sonataflow-psql-postgresql
  namespace: sonataflow-infra
spec:
  selector:
    app: sonataflow-psql-postgresql
  ports:
    - port: 5432
      targetPort: 5432
